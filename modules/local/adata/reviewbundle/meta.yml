name: "adata_reviewbundle"
description: Export a review bundle with a CELLxGENE-ready AnnData object, per-annotator label tables and UMAP plots
keywords:
  - cellxgene
  - review
  - annotation
  - anndata
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Final AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - cell_type_col:
      type: string
      description: Name of the canonical cell type column in obs, for example `cell_type`
  - group_cols:
      type: string
      description: Space-separated list of additional obs columns to plot and retain in the CELLxGENE object

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: CELLxGENE-ready AnnData object
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  annotation_csvs:
    - "annotations/*.csv":
        type: file
        description: One CSV of per-cell labels per annotator tool
        pattern: "annotations/*.csv"
  plots:
    - "plots/*.png":
        type: file
        description: UMAP plots coloured by cell type and grouping columns
        pattern: "plots/*.png"
        ontologies:
          - edam: "http://edamontology.org/format_3603"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
